services:
  - type: web
    name: ledgerly-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: ledgerly-db
    databaseName: ledgerly
    user: ledgerly
