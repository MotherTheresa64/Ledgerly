# A generic, single database configuration.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Flask-Migrate supplies the SQLAlchemy URL from the application configuration.
# Keeping a placeholder prevents accidental use of a hard-coded production URL.
sqlalchemy.url = sqlite:///ledgerly.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
